# PDFHorse — werkmap voor uploads/uitvoer. pdfhorse.service heeft hem nodig in ReadWritePaths;
# zonder deze map faalt de start met 226/NAMESPACE (na een herstart van de server is /tmp leeg).
# Installeren: sudo cp deploy/pdfhorse.tmpfiles.conf /etc/tmpfiles.d/pdfhorse.conf && sudo systemd-tmpfiles --create /etc/tmpfiles.d/pdfhorse.conf
d /tmp/pdfhorse 0750 pdfhorse pdfhorse -
